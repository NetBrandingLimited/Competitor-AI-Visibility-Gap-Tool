# Nginx reverse proxy for Next.js (Competitor-AI-Visibility-Gap-Tool)
# Host: competitor-ai-visibility-gap.netbranding.co.nz
# Upstream: Node listens on 127.0.0.1:3000 (pm2: npm start / next start)
#
# Install on Ubuntu/Debian VPS:
#   sudo cp docs/deployment/nginx-competitor-ai-visibility-gap.netbranding.co.nz.conf \
#     /etc/nginx/sites-available/competitor-ai-visibility-gap.netbranding.co.nz.conf
#   sudo ln -sf /etc/nginx/sites-available/competitor-ai-visibility-gap.netbranding.co.nz.conf \
#     /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS (after DNS A/AAAA points to this server):
#   sudo certbot --nginx -d competitor-ai-visibility-gap.netbranding.co.nz
# Certbot will patch ssl_certificate paths; placeholders below match default Let's Encrypt layout.

upstream competitor_ai_visibility_gap_next {
  server 127.0.0.1:3000;
  keepalive 64;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name competitor-ai-visibility-gap.netbranding.co.nz;

  # ACME HTTP-01 (certbot nginx plugin manages this after first run)
  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name competitor-ai-visibility-gap.netbranding.co.nz;

  ssl_certificate     /etc/letsencrypt/live/competitor-ai-visibility-gap.netbranding.co.nz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/competitor-ai-visibility-gap.netbranding.co.nz/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  # Uncomment after `certbot` creates it (omit if `nginx -t` complains file missing):
  # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  client_max_body_size 25m;

  location / {
    proxy_pass http://competitor_ai_visibility_gap_next;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 86400;
  }
}
